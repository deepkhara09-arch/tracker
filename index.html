<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flowr">
<title>Flowr</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
html,body{height:100%;overflow:hidden}
:root{
  --bg:#fafaf8;--s1:#f2f2ef;--s2:#e8e8e4;
  --ink:#111;--ink2:#777;--ink3:#bbb;
  --ln:#e4e4e0;
  --g:#1a6b42;--g-bg:#edf6f1;
  --r:#c0392b;--r-bg:#fdf0ef;
  --a:#c8860a;--a-bg:#fdf4e3;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0e0e0e;--s1:#181818;--s2:#222;
  --ink:#efefef;--ink2:#888;--ink3:#444;
  --ln:#282828;
  --g:#3ecf8e;--g-bg:#0a2318;
  --r:#e07070;--r-bg:#280e0e;
  --a:#e6a93a;--a-bg:#2a1e00;
}}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
#sw{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-top:env(safe-area-inset-top)}
.bnav{flex-shrink:0;display:flex;background:var(--bg);border-top:.5px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
.nt{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 7px;background:none;border:none;color:var(--ink3);font-size:10px;letter-spacing:.04em;cursor:pointer;font-family:inherit;min-height:44px}
.nt.on{color:var(--ink)}
.nt svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.pg{display:none;min-height:100%}
.pg.on{display:block}
.phead{padding:24px 20px 0;margin-bottom:28px}
.phead h1{font-size:30px;font-weight:500;letter-spacing:-.8px;line-height:1}
.phead-sub{font-size:11px;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.pc{padding:0 20px 40px}
.hero{padding:0 20px 24px}
.hero-lbl{font-size:11px;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.hero-n{font-size:48px;font-weight:400;letter-spacing:-2px;line-height:1;font-variant-numeric:tabular-nums}
.hero-sub{font-size:13px;color:var(--ink2);margin-top:8px}
.srow{display:grid;grid-template-columns:1fr 1fr;gap:.5px;background:var(--ln);border-radius:12px;overflow:hidden;margin-bottom:24px}
.sc{background:var(--s1);padding:14px 16px}
.sc-l{font-size:11px;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.sc-v{font-size:22px;font-weight:500;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.bw{height:2px;background:var(--s2);border-radius:99px;margin:10px 0 5px}
.bf{height:2px;border-radius:99px}
.rows{border-top:.5px solid var(--ln)}
.row{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:.5px solid var(--ln)}
.row-info{flex:1;min-width:0}
.row-name{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-meta{font-size:12px;color:var(--ink3);margin-top:2px}
.row-note{font-size:12px;color:var(--ink2);margin-top:2px;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-right{text-align:right;flex-shrink:0}
.row-amt{font-size:15px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.row-actions{display:flex;gap:6px;justify-content:flex-end;margin-top:4px}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:5px}
.mnav{display:flex;align-items:center;margin-bottom:20px}
.mnav-btn{background:none;border:.5px solid var(--ln);border-radius:8px;padding:7px 13px;color:var(--ink2);cursor:pointer;font-size:13px;font-family:inherit;min-height:36px}
.mnav-lbl{flex:1;text-align:center;font-size:15px;font-weight:500;letter-spacing:-.2px}
input,select,textarea{width:100%;padding:13px 14px;border:.5px solid var(--ln);border-radius:8px;background:var(--s1);color:var(--ink);font-size:16px;outline:none;font-family:inherit;-webkit-appearance:none;appearance:none;transition:border-color .15s;min-height:44px}
input:focus,select:focus,textarea:focus{border-color:var(--ink3)}
textarea{min-height:44px;resize:none;height:44px;line-height:1.4}
.fld{margin-bottom:18px}
.fld label{display:block;font-size:11px;color:var(--ink3);letter-spacing:.07em;text-transform:uppercase;margin-bottom:8px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:block;width:100%;padding:15px;border-radius:8px;font-size:16px;font-weight:500;cursor:pointer;border:none;font-family:inherit;letter-spacing:-.2px;min-height:50px}
.btn:active{opacity:.7}
.btn-ink{background:var(--ink);color:var(--bg)}
.btn-ghost{background:var(--s1);color:var(--ink);border:.5px solid var(--ln)}
.ibtn{padding:7px 12px;font-size:12px;width:auto;display:inline-block;border-radius:8px;border:.5px solid var(--ln);background:none;color:var(--ink2);cursor:pointer;font-family:inherit;min-height:34px;letter-spacing:0}
.ibtn.danger{color:var(--r);border-color:transparent}
.ibtn.act{color:var(--g);border-color:transparent}
.seg{display:flex;background:var(--s1);border-radius:8px;padding:3px;gap:2px;margin-bottom:20px;border:.5px solid var(--ln)}
.sb{flex:1;padding:9px 4px;border:none;background:none;border-radius:6px;font-size:13px;font-weight:500;color:var(--ink2);cursor:pointer;font-family:inherit;min-height:38px}
.sb.on{background:var(--bg);color:var(--ink)}
.stabs{display:flex;border-bottom:.5px solid var(--ln);margin-bottom:24px}
.stb{flex:1;padding:11px 0;font-size:14px;font-weight:500;color:var(--ink3);background:none;border:none;cursor:pointer;font-family:inherit;border-bottom:1.5px solid transparent;margin-bottom:-.5px;min-height:44px}
.stb.on{color:var(--ink);border-bottom-color:var(--ink)}
.sitem{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:.5px solid var(--ln)}
.sitem:first-child{border-top:.5px solid var(--ln)}
.sitem-r{display:flex;gap:8px;flex-shrink:0;margin-left:12px}
.bd{display:none;position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:100}
.bd.on{display:block}
.sh{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-radius:18px 18px 0 0;padding:0 20px;padding-bottom:calc(28px + env(safe-area-inset-bottom));z-index:101;transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);max-height:92dvh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sh.on{transform:translateY(0)}
.sh-handle{width:32px;height:4px;background:var(--s2);border-radius:99px;margin:12px auto 22px}
.sh-title{font-size:19px;font-weight:500;letter-spacing:-.4px;margin-bottom:22px}
.rc{padding:14px 0;border-bottom:.5px solid var(--ln);cursor:pointer}
.rc:first-child{border-top:.5px solid var(--ln)}
.toast{position:fixed;top:calc(env(safe-area-inset-top) + 16px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 18px;border-radius:99px;font-size:13px;font-weight:500;z-index:999;pointer-events:none;transition:opacity .25s;white-space:nowrap}
.empty{padding:48px 0;text-align:center;color:var(--ink3);font-size:14px}
.dlbl{font-size:11px;color:var(--ink3);letter-spacing:.07em;text-transform:uppercase;padding:20px 0 10px}
.seclbl{font-size:11px;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px}
.budget-bar{background:var(--s1);border-radius:10px;padding:12px 14px;margin-bottom:20px;border:.5px solid var(--ln)}
.budget-bar-lbl{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.budget-bar-title{font-size:13px;font-weight:500}
.budget-bar-amt{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.src-status{display:flex;flex-direction:column;gap:0;margin-bottom:24px;border-radius:10px;overflow:hidden;border:.5px solid var(--ln)}
.src-row{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--s1)}
.src-row+.src-row{border-top:.5px solid var(--ln)}
.src-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.src-name{flex:1;font-size:14px;font-weight:500;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src-status-lbl{font-size:12px;font-variant-numeric:tabular-nums}
.repeat-strip{margin-bottom:20px}
.repeat-lbl{font-size:11px;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.repeat-pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.repeat-pill{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-start;padding:9px 12px;border:.5px solid var(--ln);border-radius:8px;background:var(--s1);cursor:pointer;min-width:90px}
.repeat-pill-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.repeat-pill-amt{font-size:12px;color:var(--ink3);margin-top:2px;font-variant-numeric:tabular-nums}
.mom-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:.5px solid var(--ln)}
.mom-row:first-child{border-top:.5px solid var(--ln)}
.mom-lbl{font-size:14px;color:var(--ink2)}
.mom-vals{display:flex;gap:10px;align-items:center}
.mom-cur{font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.mom-diff{font-size:12px;font-variant-numeric:tabular-nums;padding:2px 7px;border-radius:99px}
</style>
</head>
<body>
<div id="sw">

  <!-- HOME -->
  <div id="pg-home" class="pg on">
    <div class="phead"><div class="phead-sub" id="h-month"></div><h1>Overview</h1></div>
    <div class="hero">
      <div class="hero-lbl">Net this month</div>
      <div class="hero-n" id="h-net">₹0</div>
      <div class="hero-sub" id="h-sub"></div>
    </div>
    <div class="pc">
      <div class="srow" id="h-stats"></div>
      <div style="margin-bottom:24px">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px">
          <span class="seclbl" style="margin-bottom:0">Savings</span>
          <span style="font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums" id="h-spct"></span>
        </div>
        <div class="bw"><div class="bf" id="h-sbar" style="width:0%"></div></div>
        <div style="font-size:12px;color:var(--ink3);margin-top:4px" id="h-ssub"></div>
      </div>
      <div class="seclbl">Income this month</div>
      <div class="src-status" id="h-src-status"></div>
      <div class="seclbl">Recent</div>
      <div class="rows" id="h-recent"></div>
    </div>
  </div>

  <!-- LOG -->
  <div id="pg-log" class="pg">
    <div class="phead"><h1>Log</h1></div>
    <div class="pc">
      <div class="seg" id="log-seg">
        <button class="sb on" onclick="setLT('misc')">Spend</button>
        <button class="sb" onclick="setLT('fixed')">Fixed</button>
        <button class="sb" onclick="setLT('income')">Income</button>
      </div>
      <div id="log-body"></div>
    </div>
  </div>

  <!-- HISTORY -->
  <div id="pg-hist" class="pg">
    <div class="phead"><h1>History</h1></div>
    <div class="pc">
      <div class="mnav">
        <button class="mnav-btn" onclick="chMonth(-1)">←</button>
        <span class="mnav-lbl" id="hist-ml"></span>
        <button class="mnav-btn" onclick="chMonth(1)">→</button>
      </div>
      <div class="seg" id="hist-seg">
        <button class="sb on" onclick="setHT('all')">All</button>
        <button class="sb" onclick="setHT('income')">Income</button>
        <button class="sb" onclick="setHT('fixed')">Fixed</button>
        <button class="sb" onclick="setHT('misc')">Misc</button>
      </div>
      <div class="rows" id="hist-list"></div>
    </div>
  </div>

  <!-- REPORTS -->
  <div id="pg-rep" class="pg">
    <div class="phead"><h1>Reports</h1></div>
    <div class="pc" id="rep-list"></div>
  </div>

  <!-- SETUP -->
  <div id="pg-set" class="pg">
    <div class="phead"><h1>Setup</h1></div>
    <div class="pc">
      <div class="stabs">
        <button class="stb on" onclick="stab(0)">Income</button>
        <button class="stb" onclick="stab(1)">Fixed</button>
        <button class="stb" onclick="stab(2)">Goals</button>
      </div>
      <div id="st0">
        <div id="si-list"></div>
        <button class="btn btn-ghost" style="margin-top:16px" onclick="openSh('sh-is')">+ Add source</button>
      </div>
      <div id="st1" style="display:none">
        <div id="sf-list"></div>
        <button class="btn btn-ghost" style="margin-top:16px" onclick="openSh('sh-fe')">+ Add expense</button>
      </div>
      <div id="st2" style="display:none">
        <div class="fld"><label>Savings target %</label><input type="number" id="g-pct" min="0" max="100" placeholder="20" inputmode="numeric"></div>
        <div class="fld"><label>Misc budget / month (₹)</label><input type="number" id="g-bgt" placeholder="5000" inputmode="numeric"></div>
        <button class="btn btn-ink" onclick="saveGoals()">Save</button>
      </div>
    </div>
  </div>

</div>

<!-- NAV -->
<nav class="bnav">
  <button class="nt on" onclick="go('home')" id="nt-home">
    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    home
  </button>
  <button class="nt" onclick="go('log')" id="nt-log">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
    log
  </button>
  <button class="nt" onclick="go('hist')" id="nt-hist">
    <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    history
  </button>
  <button class="nt" onclick="go('rep')" id="nt-rep">
    <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    reports
  </button>
  <button class="nt" onclick="go('set')" id="nt-set">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    setup
  </button>
</nav>

<!-- SHEETS -->
<div class="bd" id="bd-sh-is" onclick="closeSh('sh-is')"></div>
<div class="sh" id="sh-is">
  <div class="sh-handle"></div>
  <div class="sh-title" id="sh-is-ttl">Add income source</div>
  <div class="fld"><label>Name</label><input id="is-n" placeholder="e.g. Full-time job, Bombshell" autocomplete="off"></div>
  <div class="fld"><label>Expected amount (₹)</label><input type="number" id="is-e" placeholder="0" inputmode="numeric"></div>
  <input type="hidden" id="is-id">
  <button class="btn btn-ink" onclick="saveIS()">Save</button>
</div>

<div class="bd" id="bd-sh-fe" onclick="closeSh('sh-fe')"></div>
<div class="sh" id="sh-fe">
  <div class="sh-handle"></div>
  <div class="sh-title" id="sh-fe-ttl">Add fixed expense</div>
  <div class="fld"><label>Name</label><input id="fe-n" placeholder="e.g. Rent, SIP, EMI, Netflix" autocomplete="off"></div>
  <div class="fld"><label>Expected amount (₹)</label><input type="number" id="fe-e" placeholder="0" inputmode="numeric"></div>
  <input type="hidden" id="fe-id">
  <button class="btn btn-ink" onclick="saveFE()">Save</button>
</div>

<!-- Edit expense sheet -->
<div class="bd" id="bd-sh-ee" onclick="closeSh('sh-ee')"></div>
<div class="sh" id="sh-ee">
  <div class="sh-handle"></div>
  <div class="sh-title">Edit entry</div>
  <div class="fld"><label>Name</label><input id="ee-n" autocomplete="off"></div>
  <div class="frow" style="margin-bottom:18px">
    <div class="fld"><label>Amount (₹)</label><input type="number" id="ee-a" inputmode="decimal"></div>
    <div class="fld"><label>Date</label><input type="date" id="ee-d"></div>
  </div>
  <div class="fld" id="ee-note-wrap"><label>Note (optional)</label><textarea id="ee-note" placeholder="e.g. client dinner, reimbursable"></textarea></div>
  <input type="hidden" id="ee-id">
  <input type="hidden" id="ee-mk">
  <button class="btn btn-ink" onclick="saveEditExp()">Save changes</button>
</div>

<!-- Edit income sheet -->
<div class="bd" id="bd-sh-ei" onclick="closeSh('sh-ei')"></div>
<div class="sh" id="sh-ei">
  <div class="sh-handle"></div>
  <div class="sh-title" id="sh-ei-ttl">Edit income</div>
  <div class="fld"><label>Amount received (₹)</label><input type="number" id="ei-a" inputmode="decimal"></div>
  <div class="fld"><label>Date</label><input type="date" id="ei-d"></div>
  <input type="hidden" id="ei-sid">
  <input type="hidden" id="ei-mk">
  <button class="btn btn-ink" onclick="saveEditInc()">Save changes</button>
</div>

<!-- Report sheet -->
<div class="bd" id="bd-sh-rpt" onclick="closeSh('sh-rpt')"></div>
<div class="sh" id="sh-rpt">
  <div class="sh-handle"></div>
  <div class="sh-title" id="rpt-ttl"></div>
  <div id="rpt-body"></div>
</div>

<script>
const K='flowr3';
let D={src:[],fx:[],savPct:20,miscBgt:5000,mo:{}};
let curMo=mknow(),lt='misc',ht='all';

function mknow(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function pad(n){return String(n).padStart(2,'0')}
function parseMo(k){const[y,m]=k.split('-');return new Date(+y,+m-1,1)}
function fmtMo(k){return parseMo(k).toLocaleDateString('en-IN',{month:'long',year:'numeric'})}
function fmt(n){return '₹'+Math.round(n).toLocaleString('en-IN')}
function fmtDiff(n){return (n>=0?'+':'')+fmt(n)}
function tod(){return new Date().toISOString().slice(0,10)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function ld(){try{const d=localStorage.getItem(K);if(d)D=JSON.parse(d)}catch(e){}}
function sv(){localStorage.setItem(K,JSON.stringify(D))}
function mo(k){if(!D.mo[k])D.mo[k]={inc:{},exp:[]};return D.mo[k]}
function prevMk(mk){const d=parseMo(mk);d.setMonth(d.getMonth()-1);return d.getFullYear()+'-'+pad(d.getMonth()+1)}

function go(p){
  document.querySelectorAll('.pg').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.nt').forEach(x=>x.classList.remove('on'));
  document.getElementById('pg-'+p).classList.add('on');
  document.getElementById('nt-'+p).classList.add('on');
  document.getElementById('sw').scrollTop=0;
  if(p==='home')rHome();
  if(p==='log')rLog();
  if(p==='hist'){curMo=mknow();rHist();}
  if(p==='rep')rRep();
  if(p==='set')rSet();
}

function openSh(id){
  document.getElementById('bd-'+id).classList.add('on');
  requestAnimationFrame(()=>requestAnimationFrame(()=>document.getElementById(id).classList.add('on')));
}
function closeSh(id){
  document.getElementById(id).classList.remove('on');
  document.getElementById('bd-'+id).classList.remove('on');
}

/* ── HOME ── */
function rHome(){
  const mk=mknow();
  document.getElementById('h-month').textContent=fmtMo(mk).toUpperCase();
  const m=mo(mk);
  const inc=Object.values(m.inc).reduce((a,v)=>a+v.a,0);
  const exp=m.exp.reduce((a,e)=>a+e.a,0);
  const net=inc-exp;
  const st=Math.round(inc*(D.savPct/100));
  const saved=Math.max(0,net);
  const avail=Math.max(0,net-st);
  const ne=document.getElementById('h-net');
  ne.textContent=fmt(net);
  ne.style.color=net<0?'var(--r)':'var(--ink)';
  document.getElementById('h-sub').textContent=fmt(inc)+' in  ·  '+fmt(exp)+' out';
  document.getElementById('h-stats').innerHTML=
    sc('received',fmt(inc),'var(--g)')+sc('spent',fmt(exp),'var(--r)')+
    sc('saved',fmt(saved),'')+sc('available',fmt(avail),'');
  const pct=st>0?Math.min(100,Math.round(saved/st*100)):0;
  document.getElementById('h-spct').textContent=pct+'%';
  const bar=document.getElementById('h-sbar');
  bar.style.width=pct+'%';
  bar.style.background=pct>=100?'var(--g)':pct>=50?'var(--a)':'var(--r)';
  document.getElementById('h-ssub').textContent=fmt(saved)+' of '+fmt(st);

  // Income source status
  const statusEl=document.getElementById('h-src-status');
  if(!D.src.length){statusEl.innerHTML='<div class="empty" style="padding:16px 0">no income sources — add in setup</div>';return;}
  statusEl.innerHTML=D.src.map(s=>{
    const v=m.inc[s.id];
    const diff=v?v.a-s.e:null;
    return`<div class="src-row">
      <div class="src-dot" style="background:${v?'var(--g)':'var(--ink3)'}"></div>
      <span class="src-name">${s.n}</span>
      <span class="src-status-lbl" style="color:${v?'var(--g)':'var(--ink3)'}">${v?fmt(v.a):'pending'}</span>
      ${v&&diff!==null?`<span style="font-size:11px;padding:2px 6px;border-radius:99px;background:${diff>=0?'var(--g-bg)':'var(--r-bg)'};color:${diff>=0?'var(--g)':'var(--r)'};font-variant-numeric:tabular-nums">${diff>=0?'+':''}${fmt(diff)}</span>`:''}
    </div>`;
  }).join('');

  const rec=[...m.exp].sort((a,b)=>b.d.localeCompare(a.d)).slice(0,5);
  document.getElementById('h-recent').innerHTML=rec.length
    ?rec.map(e=>`<div class="row"><div class="dot" style="background:${e.c==='misc'?'var(--r)':'var(--ink3)'}"></div><div class="row-info"><div class="row-name">${e.n}</div><div class="row-meta">${e.d}${e.note?' · '+e.note:''}</div></div><div class="row-right"><div class="row-amt" style="color:var(--r)">${fmt(e.a)}</div></div></div>`).join('')
    :'<div class="empty">nothing logged yet</div>';
}
function sc(l,v,c){return`<div class="sc"><div class="sc-l">${l}</div><div class="sc-v"${c?' style="color:'+c+'"':''}>${v}</div></div>`}

/* ── LOG ── */
function setLT(t){
  lt=t;
  document.querySelectorAll('#log-seg .sb').forEach((b,i)=>b.classList.toggle('on',['misc','fixed','income'][i]===t));
  rLog();
}

function rLog(){
  const el=document.getElementById('log-body');
  const mk=mknow();
  const m=mo(mk);

  if(lt==='misc'){
    // Misc budget bar
    const spent=m.exp.filter(e=>e.c==='misc').reduce((a,e)=>a+e.a,0);
    const bgt=D.miscBgt||0;
    const pct=bgt>0?Math.min(100,Math.round(spent/bgt*100)):0;
    const barCol=pct>=100?'var(--r)':pct>=75?'var(--a)':'var(--g)';

    // Recent misc for repeat
    const recent=getRecentMisc(5);
    const repeatHTML=recent.length?`<div class="repeat-strip">
      <div class="repeat-lbl">Repeat</div>
      <div class="repeat-pills">${recent.map(r=>`<div class="repeat-pill" onclick="repeatSpend('${esc(r.n)}',${r.a})"><div class="repeat-pill-name">${r.n}</div><div class="repeat-pill-amt">${fmt(r.a)}</div></div>`).join('')}</div>
    </div>`:'';

    el.innerHTML=`
<div class="budget-bar">
  <div class="budget-bar-lbl"><span class="budget-bar-title">Misc budget</span><span class="budget-bar-amt">${fmt(spent)} <span style="color:var(--ink3)">of ${fmt(bgt)}</span></span></div>
  <div class="bw"><div class="bf" style="width:${pct}%;background:${barCol}"></div></div>
  <div style="font-size:12px;color:var(--ink3);margin-top:4px">${bgt>spent?fmt(bgt-spent)+' remaining':fmt(spent-bgt)+' over budget'}</div>
</div>
${repeatHTML}
<div class="fld"><label>What?</label><input id="lm-n" placeholder="e.g. Lunch, Uber, Zomato" autocomplete="off"></div>
<div class="frow" style="margin-bottom:12px">
  <div class="fld"><label>Amount (₹)</label><input type="number" id="lm-a" placeholder="0" inputmode="decimal"></div>
  <div class="fld"><label>Date</label><input type="date" id="lm-d" value="${tod()}"></div>
</div>
<div class="fld"><label>Note (optional)</label><textarea id="lm-note" placeholder="e.g. client dinner, reimbursable"></textarea></div>
<button class="btn btn-ink" onclick="logMisc()">Log spend</button>`;
    setTimeout(()=>{try{document.getElementById('lm-n').focus()}catch(e){}},120);

  } else if(lt==='fixed'){
    const opts=D.fx.map(f=>`<option value="${f.id}">${f.n}</option>`).join('');
    el.innerHTML=`
<div class="fld"><label>Which?</label><select id="lf-id">${opts||'<option disabled selected>add fixed expenses in setup first</option>'}</select></div>
<div class="frow" style="margin-bottom:18px">
  <div class="fld"><label>Actual (₹)</label><input type="number" id="lf-a" placeholder="0" inputmode="decimal"></div>
  <div class="fld"><label>Date</label><input type="date" id="lf-d" value="${tod()}"></div>
</div>
<button class="btn btn-ink" onclick="logFx()"${!D.fx.length?' disabled':''}>Log expense</button>`;

  } else {
    const opts=D.src.map(s=>`<option value="${s.id}">${s.n}</option>`).join('');
    el.innerHTML=`
<div class="fld"><label>Source</label><select id="li-id">${opts||'<option disabled selected>add income sources in setup first</option>'}</select></div>
<div class="frow" style="margin-bottom:18px">
  <div class="fld"><label>Received (₹)</label><input type="number" id="li-a" placeholder="0" inputmode="decimal"></div>
  <div class="fld"><label>Date</label><input type="date" id="li-d" value="${tod()}"></div>
</div>
<button class="btn btn-ink" onclick="logInc()"${!D.src.length?' disabled':''}>Log income</button>`;
  }
}

function getRecentMisc(n){
  const seen=new Map();
  const allMo=Object.keys(D.mo).sort().reverse();
  for(const mk of allMo){
    for(const e of (D.mo[mk].exp||[]).filter(x=>x.c==='misc').sort((a,b)=>b.d.localeCompare(a.d))){
      if(!seen.has(e.n))seen.set(e.n,{n:e.n,a:e.a});
      if(seen.size>=n)break;
    }
    if(seen.size>=n)break;
  }
  return Array.from(seen.values());
}

function esc(s){return s.replace(/'/g,"\\'")}

function repeatSpend(name,amt){
  try{
    document.getElementById('lm-n').value=name;
    document.getElementById('lm-a').value=amt;
    document.getElementById('lm-d').value=tod();
    document.getElementById('lm-note').value='';
    document.getElementById('lm-n').focus();
  }catch(e){}
}

function logMisc(){
  const n=document.getElementById('lm-n').value.trim();
  const a=parseFloat(document.getElementById('lm-a').value)||0;
  const d=document.getElementById('lm-d').value;
  const note=document.getElementById('lm-note').value.trim();
  if(!n||!a||!d)return;
  const entry={id:uid(),n,a,d,c:'misc'};
  if(note)entry.note=note;
  mo(d.slice(0,7)).exp.push(entry);
  sv();toast('Logged');rLog();
}
function logFx(){
  const fid=document.getElementById('lf-id').value;
  const a=parseFloat(document.getElementById('lf-a').value)||0;
  const d=document.getElementById('lf-d').value;
  if(!fid||!a||!d)return;
  const fx=D.fx.find(f=>f.id===fid);
  mo(d.slice(0,7)).exp.push({id:uid(),n:fx?fx.n:'Fixed',a,d,c:'fixed'});
  sv();toast('Logged');rLog();
}
function logInc(){
  const sid=document.getElementById('li-id').value;
  const a=parseFloat(document.getElementById('li-a').value)||0;
  const d=document.getElementById('li-d').value;
  if(!sid||!a||!d)return;
  mo(d.slice(0,7)).inc[sid]={a,d};
  sv();toast('Logged');rLog();
}

/* ── EDIT EXPENSE ── */
function editExp(id,mk){
  const m=mo(mk);
  const e=m.exp.find(x=>x.id===id);
  if(!e)return;
  document.getElementById('ee-n').value=e.n;
  document.getElementById('ee-a').value=e.a;
  document.getElementById('ee-d').value=e.d;
  document.getElementById('ee-note').value=e.note||'';
  document.getElementById('ee-note-wrap').style.display=e.c==='misc'?'block':'none';
  document.getElementById('ee-id').value=id;
  document.getElementById('ee-mk').value=mk;
  openSh('sh-ee');
}
function saveEditExp(){
  const id=document.getElementById('ee-id').value;
  const mk=document.getElementById('ee-mk').value;
  const m=mo(mk);
  const e=m.exp.find(x=>x.id===id);
  if(!e)return;
  e.n=document.getElementById('ee-n').value.trim()||e.n;
  e.a=parseFloat(document.getElementById('ee-a').value)||e.a;
  e.d=document.getElementById('ee-d').value||e.d;
  const note=document.getElementById('ee-note').value.trim();
  if(note)e.note=note; else delete e.note;
  sv();closeSh('sh-ee');rHistList();toast('Updated');
}

/* ── EDIT INCOME ── */
function editInc(sid,mk){
  const m=mo(mk);
  const v=m.inc[sid];
  const src=D.src.find(s=>s.id===sid);
  document.getElementById('sh-ei-ttl').textContent='Edit: '+(src?src.n:'income');
  document.getElementById('ei-a').value=v?v.a:'';
  document.getElementById('ei-d').value=v?v.d:tod();
  document.getElementById('ei-sid').value=sid;
  document.getElementById('ei-mk').value=mk;
  openSh('sh-ei');
}
function saveEditInc(){
  const sid=document.getElementById('ei-sid').value;
  const mk=document.getElementById('ei-mk').value;
  const a=parseFloat(document.getElementById('ei-a').value)||0;
  const d=document.getElementById('ei-d').value;
  if(!a||!d)return;
  mo(mk).inc[sid]={a,d};
  sv();closeSh('sh-ei');rHistList();rHome();toast('Updated');
}

/* ── HISTORY ── */
function setHT(t){
  ht=t;
  document.querySelectorAll('#hist-seg .sb').forEach((b,i)=>b.classList.toggle('on',['all','income','fixed','misc'][i]===t));
  rHistList();
}
function chMonth(dir){
  const d=parseMo(curMo);d.setMonth(d.getMonth()+dir);
  curMo=d.getFullYear()+'-'+pad(d.getMonth()+1);
  rHist();
}
function rHist(){
  document.getElementById('hist-ml').textContent=fmtMo(curMo);
  rHistList();
}
function rHistList(){
  const m=mo(curMo);let rows=[];
  if(ht==='all'||ht==='income'){
    D.src.forEach(s=>{
      const v=m.inc[s.id];
      if(v)rows.push({n:s.n,a:v.a,d:v.d,t:'inc',c:'income',sid:s.id});
    });
  }
  m.exp.forEach(e=>{if(ht==='all'||ht===e.c)rows.push({...e,t:'exp'})});
  rows.sort((a,b)=>b.d.localeCompare(a.d));
  document.getElementById('hist-list').innerHTML=rows.length
    ?rows.map(r=>`<div class="row">
      <div class="dot" style="background:${r.t==='inc'?'var(--g)':r.c==='misc'?'var(--r)':'var(--ink3)'}"></div>
      <div class="row-info">
        <div class="row-name">${r.n}</div>
        <div class="row-meta">${r.d} · ${r.c}</div>
        ${r.note?`<div class="row-note">${r.note}</div>`:''}
      </div>
      <div class="row-right">
        <div class="row-amt" style="color:${r.t==='inc'?'var(--g)':'var(--r)'}">${r.t==='inc'?'+':'−'}${fmt(r.a)}</div>
        <div class="row-actions">
          ${r.t==='exp'?`<button class="ibtn act" onclick="editExp('${r.id}','${curMo}')">edit</button><button class="ibtn danger" onclick="delExp('${r.id}')">del</button>`:`<button class="ibtn act" onclick="editInc('${r.sid}','${curMo}')">edit</button>`}
        </div>
      </div></div>`).join('')
    :'<div class="empty">nothing here</div>';
}
function delExp(id){
  Object.keys(D.mo).forEach(k=>{D.mo[k].exp=D.mo[k].exp.filter(e=>e.id!==id)});
  sv();rHistList();toast('Deleted');
}

/* ── REPORTS ── */
function rRep(){
  const keys=Object.keys(D.mo).sort().reverse();
  document.getElementById('rep-list').innerHTML=keys.length
    ?keys.map(k=>{
      const m=D.mo[k];
      const inc=Object.values(m.inc||{}).reduce((a,v)=>a+v.a,0);
      const exp=(m.exp||[]).reduce((a,e)=>a+e.a,0);
      const net=inc-exp;
      return`<div class="rc" onclick="showRpt('${k}')">
        <div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:16px;font-weight:500;letter-spacing:-.2px">${fmtMo(k)}</span><span style="font-size:16px;font-weight:500;font-variant-numeric:tabular-nums;color:${net>=0?'var(--g)':'var(--r)'}">${fmt(net)}</span></div>
        <div style="font-size:12px;color:var(--ink3);margin-top:3px">${fmt(inc)} in · ${fmt(exp)} out</div>
      </div>`;
    }).join('')
    :'<div class="empty">no data yet</div>';
}

function showRpt(mk){
  const m=mo(mk);
  const pm=D.mo[prevMk(mk)];
  const inc=Object.values(m.inc).reduce((a,v)=>a+v.a,0);
  const exp=m.exp.reduce((a,e)=>a+e.a,0);
  const fxAmt=m.exp.filter(e=>e.c==='fixed').reduce((a,e)=>a+e.a,0);
  const msAmt=m.exp.filter(e=>e.c==='misc').reduce((a,e)=>a+e.a,0);
  const st=Math.round(inc*(D.savPct/100));
  const saved=Math.max(0,inc-exp);
  const pct=st>0?Math.min(100,Math.round(saved/st*100)):0;

  // month-over-month
  let momHTML='';
  if(pm){
    const pinc=Object.values(pm.inc||{}).reduce((a,v)=>a+v.a,0);
    const pexp=(pm.exp||[]).reduce((a,e)=>a+e.a,0);
    const pfx=(pm.exp||[]).filter(e=>e.c==='fixed').reduce((a,e)=>a+e.a,0);
    const pms=(pm.exp||[]).filter(e=>e.c==='misc').reduce((a,e)=>a+e.a,0);
    const psaved=Math.max(0,pinc-pexp);
    const rows=[
      ['Income',inc,pinc],
      ['Expenses',exp,pexp],
      ['Fixed',fxAmt,pfx],
      ['Misc',msAmt,pms],
      ['Saved',saved,psaved],
    ];
    momHTML=`<div class="dlbl">vs last month</div>
    <div class="rows" style="margin-bottom:4px">${rows.map(([l,cur,prev])=>{
      const diff=cur-prev;
      const isGood=(l==='Income'||l==='Saved')?diff>=0:diff<=0;
      return`<div class="mom-row"><span class="mom-lbl">${l}</span><div class="mom-vals"><span class="mom-cur">${fmt(cur)}</span><span class="mom-diff" style="background:${diff===0?'var(--s2)':isGood?'var(--g-bg)':'var(--r-bg)'};color:${diff===0?'var(--ink3)':isGood?'var(--g)':'var(--r)'}">${diff===0?'—':fmtDiff(diff)}</span></div></div>`;
    }).join('')}</div>`;
  }

  const incRows=D.src.map(s=>{
    const v=m.inc[s.id];
    return`<div class="row"><div class="dot" style="background:${v?'var(--g)':'var(--ink3)'}"></div><div class="row-info"><div class="row-name">${s.n}</div><div class="row-meta">${v?v.d:'pending'}</div></div><div class="row-right"><div class="row-amt" style="color:${v?'var(--g)':'var(--ink3)'}">${v?'+'+fmt(v.a):'—'}</div></div></div>`;
  }).join('')||'<div class="empty">none</div>';

  const fxRows=m.exp.filter(e=>e.c==='fixed').sort((a,b)=>b.d.localeCompare(a.d)).map(e=>`<div class="row"><div class="dot" style="background:var(--ink3)"></div><div class="row-info"><div class="row-name">${e.n}</div><div class="row-meta">${e.d}</div></div><div class="row-right"><div class="row-amt" style="color:var(--r)">${fmt(e.a)}</div></div></div>`).join('')||'<div class="empty">none</div>';

  const msRows=m.exp.filter(e=>e.c==='misc').sort((a,b)=>b.d.localeCompare(a.d)).map(e=>`<div class="row"><div class="dot" style="background:var(--r)"></div><div class="row-info"><div class="row-name">${e.n}</div><div class="row-meta">${e.d}${e.note?' · '+e.note:''}</div></div><div class="row-right"><div class="row-amt" style="color:var(--r)">${fmt(e.a)}</div></div></div>`).join('')||'<div class="empty">none</div>';

  document.getElementById('rpt-ttl').textContent=fmtMo(mk);
  document.getElementById('rpt-body').innerHTML=`
    <div class="srow" style="margin-bottom:20px">${sc('income',fmt(inc),'var(--g)')+sc('expenses',fmt(exp),'var(--r)')+sc('saved',fmt(saved),'')+sc('net',fmt(inc-exp),inc-exp>=0?'var(--g)':'var(--r)')}</div>
    <div style="margin-bottom:20px">
      <div style="font-size:11px;color:var(--ink3);letter-spacing:.07em;text-transform:uppercase;margin-bottom:4px">Savings · ${pct}%</div>
      <div class="bw"><div class="bf" style="width:${pct}%;background:${pct>=100?'var(--g)':pct>=50?'var(--a)':'var(--r)'}"></div></div>
      <div style="font-size:12px;color:var(--ink3);margin-top:4px">${fmt(saved)} of ${fmt(st)}</div>
    </div>
    ${momHTML}
    <div class="dlbl">Income</div><div class="rows" style="margin-bottom:4px">${incRows}</div>
    <div class="dlbl">Fixed · ${fmt(fxAmt)}</div><div class="rows" style="margin-bottom:4px">${fxRows}</div>
    <div class="dlbl">Misc · ${fmt(msAmt)}</div><div class="rows">${msRows}</div>`;
  openSh('sh-rpt');
}

/* ── SETUP ── */
function rSet(){
  document.getElementById('si-list').innerHTML=D.src.length
    ?D.src.map(s=>`<div class="sitem"><div style="min-width:0;flex:1"><div style="font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${s.n}</div><div style="font-size:12px;color:var(--ink3);margin-top:2px">${fmt(s.e)}</div></div><div class="sitem-r"><button class="ibtn" onclick="editIS('${s.id}')">edit</button><button class="ibtn danger" onclick="delIS('${s.id}')">del</button></div></div>`).join('')
    :'<div class="empty">no sources yet</div>';
  document.getElementById('sf-list').innerHTML=D.fx.length
    ?D.fx.map(f=>`<div class="sitem"><div style="min-width:0;flex:1"><div style="font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${f.n}</div><div style="font-size:12px;color:var(--ink3);margin-top:2px">${fmt(f.e)}</div></div><div class="sitem-r"><button class="ibtn" onclick="editFE('${f.id}')">edit</button><button class="ibtn danger" onclick="delFE('${f.id}')">del</button></div></div>`).join('')
    :'<div class="empty">no fixed expenses yet</div>';
  document.getElementById('g-pct').value=D.savPct;
  document.getElementById('g-bgt').value=D.miscBgt;
}
function stab(i){
  document.querySelectorAll('.stb').forEach((b,j)=>b.classList.toggle('on',i===j));
  [0,1,2].forEach(j=>document.getElementById('st'+j).style.display=i===j?'block':'none');
}
function saveIS(){
  const n=document.getElementById('is-n').value.trim();
  const e=parseFloat(document.getElementById('is-e').value)||0;
  const id=document.getElementById('is-id').value;
  if(!n)return;
  if(id){const s=D.src.find(x=>x.id===id);if(s){s.n=n;s.e=e;}}
  else D.src.push({id:uid(),n,e});
  document.getElementById('is-n').value='';
  document.getElementById('is-e').value='';
  document.getElementById('is-id').value='';
  document.getElementById('sh-is-ttl').textContent='Add income source';
  sv();closeSh('sh-is');rSet();
}
function editIS(id){
  const s=D.src.find(x=>x.id===id);if(!s)return;
  document.getElementById('sh-is-ttl').textContent='Edit source';
  document.getElementById('is-n').value=s.n;
  document.getElementById('is-e').value=s.e;
  document.getElementById('is-id').value=id;
  openSh('sh-is');
}
function delIS(id){D.src=D.src.filter(x=>x.id!==id);sv();rSet()}
function saveFE(){
  const n=document.getElementById('fe-n').value.trim();
  const e=parseFloat(document.getElementById('fe-e').value)||0;
  const id=document.getElementById('fe-id').value;
  if(!n)return;
  if(id){const f=D.fx.find(x=>x.id===id);if(f){f.n=n;f.e=e;}}
  else D.fx.push({id:uid(),n,e});
  document.getElementById('fe-n').value='';
  document.getElementById('fe-e').value='';
  document.getElementById('fe-id').value='';
  document.getElementById('sh-fe-ttl').textContent='Add fixed expense';
  sv();closeSh('sh-fe');rSet();
}
function editFE(id){
  const f=D.fx.find(x=>x.id===id);if(!f)return;
  document.getElementById('sh-fe-ttl').textContent='Edit expense';
  document.getElementById('fe-n').value=f.n;
  document.getElementById('fe-e').value=f.e;
  document.getElementById('fe-id').value=id;
  openSh('sh-fe');
}
function delFE(id){D.fx=D.fx.filter(x=>x.id!==id);sv();rSet()}
function saveGoals(){
  D.savPct=parseFloat(document.getElementById('g-pct').value)||20;
  D.miscBgt=parseFloat(document.getElementById('g-bgt').value)||5000;
  sv();toast('Saved');
}
function toast(msg){
  const t=document.createElement('div');
  t.className='toast';t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),280)},1100);
}

ld();rHome();
</script>
</body>
</html>
